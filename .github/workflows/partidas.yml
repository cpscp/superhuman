name: Build Partidas

on:
  push:
    branches: [ partidas ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Partidas.apk
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="partidas"
          NOTES="Partidas ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC. Abre no Pixel e instala o Partidas.apk."
          if gh release view $TAG >/dev/null 2>&1; then
            gh release upload $TAG Partidas.apk --clobber
            gh release edit $TAG --notes "$NOTES"
          else
            gh release create $TAG Partidas.apk --title "Partidas" --notes "$NOTES" --latest=false --target partidas
          fi
      - name: Guardar log se falhar
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
