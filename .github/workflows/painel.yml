name: Build Painel

on:
  push:
    branches: [ painel ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Painel.apk
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="painel"
          NOTES="Painel ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC. Abre no tablet e instala o Painel.apk."
          if gh release view $TAG >/dev/null 2>&1; then
            gh release upload $TAG Painel.apk --clobber
            gh release edit $TAG --notes "$NOTES"
          else
            gh release create $TAG Painel.apk --title "Painel" --notes "$NOTES" --latest=false --target painel
          fi
      - name: Guardar log se falhar
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
