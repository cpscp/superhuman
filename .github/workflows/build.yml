name: Build Liquid

on:
  push:
    branches: [ main, liquid-launcher ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Liquid.apk
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="liquid"
          NOTES="Liquid ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC. Abre no Pixel e instala o Liquid.apk."
          if gh release view $TAG >/dev/null 2>&1; then
            gh release upload $TAG Liquid.apk --clobber
            gh release edit $TAG --notes "$NOTES"
          else
            gh release create $TAG Liquid.apk --title "Liquid launcher" --notes "$NOTES" --latest=false
          fi
      - name: Relatório do build
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA=${GITHUB_SHA::7}
          mkdir -p /tmp/report && cd /tmp/report
          git init -q && git checkout -q -b ci
          echo "$STATUS $SHA $(date -u '+%H:%M')" > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -E "^e: |error:|ERROR|FAILURE|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300 > errors.txt || true
            tail -80 "$GITHUB_WORKSPACE/build.log" > tail.txt
          fi
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "ci $STATUS $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci:refs/heads/liquid-ci-log
