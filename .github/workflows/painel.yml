name: Build Painel

on:
  push:
    branches: [ painel ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Decifrar o SDK das Google Home APIs
        env:
          HOMESDK_KEY: ${{ secrets.HOMESDK_KEY }}
        run: |
          if [ -z "$HOMESDK_KEY" ]; then echo "::error::Falta o segredo HOMESDK_KEY (Settings > Secrets and variables > Actions)"; exit 1; fi
          mkdir -p homesdk
          printf '%s' "$HOMESDK_KEY" | tr -d ' \r\n\t"' > /tmp/k; echo "chave: $(wc -c < /tmp/k) caracteres"
          openssl enc -d -aes-256-cbc -pbkdf2 -in third_party/homesdk.tgz.enc -pass file:/tmp/k | tar xz -C homesdk
          rm /tmp/k
      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Painel.apk
      - name: Verificar corrotinas (Mutex.unlock$default)
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath | grep -m3 "kotlinx-coroutines-core" || true
          J=$(find ~/.gradle/caches -name 'kotlinx-coroutines-core-jvm-*.jar' ! -name '*sources*' | sort -V | tail -1)
          echo "jar: $J"
          mkdir -p /tmp/kc && unzip -o -q "$J" 'kotlinx/coroutines/sync/Mutex*.class' -d /tmp/kc
          javap -cp /tmp/kc kotlinx.coroutines.sync.Mutex | grep -i unlock || true
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="painel"
          NOTES="Painel ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC. Abre no tablet e instala o Painel.apk."
          if gh release view $TAG >/dev/null 2>&1; then
            gh release upload $TAG Painel.apk --clobber
            gh release edit $TAG --notes "$NOTES"
          else
            gh release create $TAG Painel.apk --title "Painel" --notes "$NOTES" --latest=false --target painel
          fi
      - name: Guardar log se falhar
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
