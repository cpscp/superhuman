name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Superhuman.apk
      - uses: actions/upload-artifact@v5
        with:
          name: superhuman-debug
          path: Superhuman.apk
      - name: Publicar na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M') UTC. Abre no telemóvel e instala o Superhuman.apk."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Superhuman.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest Superhuman.apk --title "Superhuman (última versão)" --notes "$NOTES" --latest
          fi
